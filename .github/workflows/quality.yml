name: Calidad y seguridad

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias
        run: npm audit --audit-level=low

      - name: Ejecutar pruebas
        run: npm test

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Compilar
        run: npm run build

      - name: Verificar salida
        run: npm run verify:build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt

      - name: Auditar dependencias
        run: python -m pip_audit -r backend/requirements-dev.txt

      - name: Ejecutar pruebas
        run: python -m unittest discover -s backend/tests -t backend -v
